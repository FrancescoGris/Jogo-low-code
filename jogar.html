<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/all.min.css">
    <title>The Hat Below - Jogar</title>
    <meta name="description"
        content="The Hat Below — um jogo de plataforma sobre um gato em busca do seu chapéu perdido.">
</head>

<body>
    <header>
    <div class="logo">
        <a href="index.html#hero">
            <img src="imgs/logo.png" alt="Logo The Hat Below">
        </a>
    </div>
    <button class="hamburguer" id="hamburguer">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <nav class="header-nav" id="header-nav">
        <a class="button-nav" href="index.html#sobre">Sobre</a>
        <a class="button-nav" href="index.html#galeria">Galeria</a>
        <a class="button-nav" href="index.html#contato">Contato</a>
        <a class="button-nav" href="jogar.html">Jogar</a>
    </nav>
</header>

    <main class="realjogo">
        <iframe src="jogo/index.html" width=100% height=500px frameborder="0"></iframe>
    </main>

    <script>
    const hamburguer = document.getElementById('hamburguer');
    const nav = document.getElementById('header-nav');

    hamburguer.addEventListener('click', function() {
        nav.classList.toggle('aberto');
    });

    document.querySelectorAll('.button-nav').forEach(link => {
        link.addEventListener('click', function() {
            nav.classList.remove('aberto');
        });
    });
</script>
</body>

</html>
